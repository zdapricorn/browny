<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Browny Vocabulary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
/* Browny system. Flashcards look like index cards: paper face, serif headword, honey edge. */
:root {
  --bg: #FBF7F4; --surface: #FFFFFF; --surface-2: #F3ECE6; --line: #E8DDD4; --paper: #FFFDF8;
  --fg: #3B2A21; --fg-soft: #87736A; --brown: #7B4B2E; --brown-deep: #5A3420;
  --honey: #F2B654; --honey-soft: #FDF0D5; --mint: #4FB98F; --mint-soft: #E2F5EC; --coral: #E9705E; --coral-soft: #FCE8E4;
  --sky: #3E7CC0; --sky-soft: #DCEBFA;
  --bear: #8A5636; --bear-light: #C08A63; --muzzle: #E9C9A8; --blush: #F49A8E;
  --font-display: "Baloo 2", "Nunito", ui-rounded, system-ui, sans-serif;
  --font-body: "Nunito", ui-rounded, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-word: "Source Serif 4", Georgia, serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1E1814; --surface: #2A221D; --surface-2: #352B25; --line: #46392F; --paper: #2F2620;
    --fg: #F5EAE2; --fg-soft: #B5A398; --brown: #D9A07A; --brown-deep: #F0C3A2;
    --honey-soft: #4A3A1E; --mint: #5FCB9F; --mint-soft: #1F3A2F; --coral: #F08472; --coral-soft: #452722;
    --sky: #8DBDF0; --sky-soft: #1E2F42; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1E1814; --surface: #2A221D; --surface-2: #352B25; --line: #46392F; --paper: #2F2620;
  --fg: #F5EAE2; --fg-soft: #B5A398; --brown: #D9A07A; --brown-deep: #F0C3A2;
  --honey-soft: #4A3A1E; --mint: #5FCB9F; --mint-soft: #1F3A2F; --coral: #F08472; --coral-soft: #452722;
  --sky: #8DBDF0; --sky-soft: #1E2F42; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
button:focus-visible { outline: 3px solid var(--honey); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 600; margin: 0; text-wrap: balance; }
[hidden] { display: none !important; }
#app { max-width: 520px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: calc(14px + env(safe-area-inset-top, 0px)) calc(40px + env(safe-area-inset-bottom, 0px)); }
.screen { display: flex; flex-direction: column; gap: 16px; animation: in .3s cubic-bezier(.2,.9,.3,1.2) both; }
@keyframes in { from { opacity: 0; transform: translateY(10px); } }

.bear .eyes-happy, .bear .eyes-sad { display: none; }
.bear[data-mood="happy"] .eyes-open, .bear[data-mood="sad"] .eyes-open { display: none; }
.bear[data-mood="happy"] .eyes-happy { display: inline; }
.bear[data-mood="sad"] .eyes-sad { display: inline; }
.bear .eyes-open { transform-box: fill-box; transform-origin: center; animation: blink 4.2s infinite; }
@keyframes blink { 0%, 93%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.1); } }
.bear .body-all { transform-box: fill-box; transform-origin: 50% 100%; animation: breathe 3.2s ease-in-out infinite; }
@keyframes breathe { 50% { transform: scale(1.025, .985); } }
.bear[data-mood="happy"] .body-all { animation: hop .6s cubic-bezier(.3,1.6,.5,1); }
@keyframes hop { 30% { transform: scale(1.05, .93); } 60% { transform: translateY(-14px); } }
.bear[data-mood="sad"] .body-all { animation: tilt .6s ease-out forwards; }
@keyframes tilt { to { transform: rotate(-6deg); } }

.top { display: flex; align-items: center; gap: 10px; }
.back { display: inline-flex; align-items: center; gap: 4px; padding: 8px 10px; border-radius: 12px; font-weight: 800; color: var(--fg-soft); text-decoration: none; }
.back:hover { background: var(--surface-2); }
.top h1 { font-size: 22px; color: var(--brown); flex: 1; min-width: 0; }
.count { font-weight: 800; color: var(--fg-soft); font-size: 14px; font-variant-numeric: tabular-nums; }
.label { font-size: 12px; font-weight: 800; letter-spacing: .8px; text-transform: uppercase; color: var(--fg-soft); }
.soft { color: var(--fg-soft); font-weight: 700; font-size: 13.5px; }

.today { display: grid; grid-template-columns: 104px 1fr; gap: 12px; align-items: end; padding: 16px 16px 0; border-radius: 22px; background: var(--surface); border: 2px solid var(--line); box-shadow: 0 6px 0 var(--line); overflow: hidden; }
.today svg { width: 104px; height: 114px; display: block; }
.today .info { align-self: center; padding-bottom: 14px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.today .nums { display: flex; gap: 14px; }
.today .nums div { display: flex; flex-direction: column; }
.today .nums b { font-family: var(--font-display); font-size: 30px; line-height: 1; color: var(--brown); font-variant-numeric: tabular-nums; }
.today .nums span { font-size: 12px; font-weight: 800; color: var(--fg-soft); }
.btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 13px 18px; border-radius: 16px; font-weight: 800; font-size: 16px; background: var(--brown); color: #FFF8F2; box-shadow: 0 5px 0 var(--brown-deep); }
.btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--brown-deep); }
.btn.ghost { background: var(--surface); color: var(--fg); border: 2px solid var(--line); box-shadow: 0 5px 0 var(--line); }
.btn.small { padding: 9px 12px; font-size: 14px; border-radius: 12px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn:not(.ghost) { color: #2A1A10; } }
:root[data-theme="dark"] .btn:not(.ghost) { color: #2A1A10; }

.decks { display: flex; flex-direction: column; gap: 10px; }
.deck { display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: 18px; background: var(--surface); border: 2px solid var(--line); }
.deck-head { display: grid; grid-template-columns: 46px 1fr auto; gap: 12px; align-items: center; }
.deck .ic { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; color: #fff; font-family: var(--font-word); font-weight: 600; font-size: 22px; }
.deck b { display: block; font-size: 16px; }
.deck .pct { font-family: var(--font-display); font-weight: 700; font-size: 18px; color: var(--brown); font-variant-numeric: tabular-nums; }
.track { height: 8px; border-radius: 999px; background: var(--surface-2); overflow: hidden; display: flex; }
.track i { display: block; height: 100%; }
.track .m { background: var(--mint); } .track .l { background: var(--honey); }
.deck-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.legend { display: flex; gap: 12px; font-size: 12px; font-weight: 700; color: var(--fg-soft); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; }

/* Flashcard */
.progress { height: 12px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--mint); border-radius: 999px; transition: width .4s cubic-bezier(.3,1.5,.5,1); }
.stage { perspective: 1200px; }
.fc { position: relative; height: 340px; transform-style: preserve-3d; transition: transform .55s cubic-bezier(.3,1.3,.5,1); cursor: pointer; }
.fc.flip { transform: rotateY(180deg); }
.fc.out-left { animation: outL .35s ease-in forwards; } .fc.out-right { animation: outR .35s ease-in forwards; } .fc.in { animation: cardIn .35s cubic-bezier(.3,1.4,.5,1); }
@keyframes outL { to { transform: translateX(-120%) rotate(-12deg); opacity: 0; } }
@keyframes outR { to { transform: translateX(120%) rotate(12deg); opacity: 0; } }
@keyframes cardIn { from { transform: translateY(24px) scale(.94); opacity: 0; } }
.face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 24px; background: var(--paper); border: 2px solid var(--line); box-shadow: 0 8px 0 var(--line); padding: 22px; display: flex; flex-direction: column; gap: 10px; overflow: hidden; }
.face::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 8px; background: var(--deck, var(--honey)); }
.face.back { transform: rotateY(180deg); }
.front { justify-content: center; align-items: center; text-align: center; }
.word { font-family: var(--font-word); font-size: 40px; font-weight: 600; line-height: 1.1; overflow-wrap: anywhere; }
.pos { font-style: italic; color: var(--fg-soft); font-weight: 700; }
.hint { position: absolute; bottom: 16px; left: 0; right: 0; text-align: center; font-size: 13px; font-weight: 700; color: var(--fg-soft); }
.speak { position: absolute; top: 18px; right: 16px; width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--surface-2); color: var(--brown); }
.speak svg { width: 22px; height: 22px; }
.back .w2 { font-family: var(--font-word); font-size: 24px; font-weight: 600; padding-right: 44px; }
.vi { font-size: 22px; font-weight: 800; color: var(--brown); line-height: 1.3; }
.syn { display: inline-flex; gap: 6px; align-items: center; align-self: flex-start; padding: 4px 10px; border-radius: 999px; background: var(--mint-soft); font-weight: 800; font-size: 14px; }
.syn span { color: var(--fg-soft); font-weight: 700; }
.ex { margin-top: auto; padding: 12px; border-radius: 14px; background: var(--surface-2); font-family: var(--font-word); font-size: 16px; line-height: 1.5; }
.ex mark { background: var(--honey-soft); color: inherit; border-radius: 4px; padding: 0 2px; }
.rate { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.rate button { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 12px 6px; border-radius: 16px; font-weight: 800; font-size: 14.5px; border: 2px solid transparent; box-shadow: 0 4px 0 rgba(0,0,0,.12); }
.rate button small { font-weight: 700; font-size: 11.5px; opacity: .8; }
.rate .r0 { background: var(--coral-soft); color: var(--coral); border-color: var(--coral); }
.rate .r1 { background: var(--honey-soft); color: var(--brown); border-color: var(--honey); }
.rate .r2 { background: var(--mint-soft); color: var(--mint); border-color: var(--mint); }
.rate button:active { transform: translateY(3px); box-shadow: none; }
.mini-bear { display: flex; align-items: center; gap: 10px; }
.mini-bear svg { width: 54px; height: 60px; flex: none; }
.mini-bear .say { background: var(--surface); border: 2px solid var(--line); border-radius: 14px; padding: 8px 12px; font-weight: 700; font-size: 14px; }

/* Quiz */
.qcard { padding: 18px; border-radius: 20px; background: var(--surface); border: 2px solid var(--line); display: flex; flex-direction: column; gap: 12px; }
.qtext { font-weight: 700; font-size: 17px; }
.qtext .qw { font-family: var(--font-word); font-size: 22px; font-weight: 600; color: var(--brown); }
.qex { font-family: var(--font-word); color: var(--fg-soft); font-size: 15px; }
.opts { display: grid; gap: 8px; }
.opt { display: flex; gap: 10px; align-items: center; text-align: left; padding: 12px 14px; border-radius: 14px; border: 2px solid var(--line); background: var(--surface); font-weight: 700; box-shadow: 0 3px 0 var(--line); }
.opt .k { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; border: 2px solid var(--line); font-family: var(--font-display); font-size: 13px; color: var(--fg-soft); flex: none; }
.opt.right { border-color: var(--mint); background: var(--mint-soft); animation: pop .4s cubic-bezier(.3,1.8,.5,1); }
.opt.right .k { background: var(--mint); border-color: var(--mint); color: #fff; }
.opt.wrong { border-color: var(--coral); background: var(--coral-soft); animation: shake .4s; }
.opt.wrong .k { background: var(--coral); border-color: var(--coral); color: #fff; }
.opt[disabled] { cursor: default; }
@keyframes pop { 40% { transform: scale(1.04); } }
@keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
.fb { padding: 10px 12px; border-radius: 12px; font-weight: 700; font-size: 14.5px; }
.fb.ok { background: var(--mint-soft); } .fb.no { background: var(--coral-soft); }

.result { align-items: center; text-align: center; }
.result svg { width: 150px; height: 165px; }
.result .big { font-family: var(--font-display); font-size: 44px; font-weight: 700; color: var(--brown); line-height: 1; }
.stats3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 100%; }
.stats3 div { padding: 10px 6px; border-radius: 16px; background: var(--surface); border: 2px solid var(--line); }
.stats3 b { display: block; font-family: var(--font-display); font-size: 24px; font-variant-numeric: tabular-nums; }
.stats3 span { font-size: 12px; font-weight: 800; color: var(--fg-soft); }
.list-words { display: flex; flex-direction: column; gap: 6px; width: 100%; text-align: left; }
.lw { display: flex; justify-content: space-between; gap: 10px; padding: 8px 12px; border-radius: 12px; background: var(--surface); border: 2px solid var(--line); font-weight: 700; font-size: 14px; }
.lw b { font-family: var(--font-word); }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); opacity: 0; background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 14px; font-weight: 800; font-size: 14px; transition: .25s; pointer-events: none; z-index: 50; max-width: calc(100% - 32px); text-align: center; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.confetti { position: fixed; z-index: 39; width: 8px; height: 8px; border-radius: 3px; pointer-events: none; animation: burst .9s cubic-bezier(.2,.7,.4,1) forwards; }
@keyframes burst { to { transform: translate(var(--dx), var(--dy)) rotate(var(--rot)); opacity: 0; } }
@media (max-width: 380px) { .fc { height: 320px; } .word { font-size: 34px; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; } }
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script src="rewards.js"></script>
<script src="vocab-data.js" charset="utf-8"></script>
<script>
(() => {
  const { DECKS } = window.BROWNY_VOCAB;
  const L = 'ABCD';
  const NEW_PER_DAY = 10;
  // Days until the next review for each box (0 = learn again today).
  const INTERVAL = [0, 1, 3, 7, 14, 30];
  const DAY = 86400000;

  /* ---------- Storage ---------- */
  const KEY = 'browny-vocab-v1';
  let S = { cards: {}, day: '', newToday: 0, reviewed: 0 };
  try { const raw = localStorage.getItem(KEY); if (raw) S = { ...S, ...JSON.parse(raw) }; } catch (e) {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
  const today = new Date().toISOString().slice(0, 10);
  if (S.day !== today) { S.day = today; S.newToday = 0; S.reviewed = 0; save(); }

  // Words saved while reading (Reading page, same site) become an extra deck.
  function myDeck() {
    let saved = [];
    try { saved = (JSON.parse(localStorage.getItem('browny-reading-v1') || '{}').vocab) || []; } catch (e) {}
    return { id: 'mine', name: 'Từ của tôi', color: '#C08A63', mine: true,
      cards: saved.map(v => ({ id: `mine:${v.word}`, deck: 'mine', word: v.word, pos: '', vi: v.meaning || '', syn: '', ex: '', from: v.from })) };
  }
  const allDecks = () => [...DECKS, myDeck()].filter(d => d.cards.length);
  const allCards = () => allDecks().flatMap(d => d.cards);
  const deckOf = id => allDecks().find(d => d.id === id);
  const st = c => S.cards[c.id];
  const isDue = c => st(c) && st(c).due <= Date.now();
  const mastered = c => st(c) && st(c).box >= 4;
  const learning = c => st(c) && st(c).box < 4;

  /* ---------- Helpers ---------- */
  const $ = s => document.querySelector(s);
  const app = $('#app');
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  let toastT;
  const toast = m => { const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 1700); };
  function confetti(el) {
    const r = el.getBoundingClientRect(), colors = ['#F2B654', '#4FB98F', '#E9705E', '#C08A63', '#3E7CC0'];
    for (let i = 0; i < 16; i++) { const c = document.createElement('i'); c.className = 'confetti'; const a = Math.random() * Math.PI * 2, d = 40 + Math.random() * 70;
      c.style.cssText = `left:${r.left + r.width / 2}px;top:${r.top + r.height / 3}px;background:${colors[i % 5]};--dx:${Math.cos(a) * d}px;--dy:${Math.sin(a) * d - 30}px;--rot:${Math.random() * 400}deg`;
      document.body.appendChild(c); setTimeout(() => c.remove(), 950); }
  }
  function speak(text) {
    try { const u = new SpeechSynthesisUtterance(text); u.lang = 'en-US'; u.rate = .9; speechSynthesis.cancel(); speechSynthesis.speak(u); }
    catch (e) { toast('Máy này chưa hỗ trợ đọc phát âm'); }
  }
  const highlightWord = (ex, w) => esc(ex).replace(new RegExp(`\\b(${w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}\\w*)`, 'i'), '<mark>$1</mark>');
  function bear(mood = 'idle') {
    return `<svg class="bear" data-mood="${mood}" viewBox="0 0 200 220" role="img" aria-label="Gấu Browny">
      <g class="body-all">
        <ellipse cx="100" cy="196" rx="54" ry="30" fill="var(--bear)"/><ellipse cx="100" cy="200" rx="30" ry="18" fill="var(--muzzle)" opacity=".7"/>
        <circle cx="50" cy="52" r="27" fill="var(--bear)"/><circle cx="50" cy="54" r="14" fill="var(--bear-light)"/>
        <circle cx="150" cy="52" r="27" fill="var(--bear)"/><circle cx="150" cy="54" r="14" fill="var(--bear-light)"/>
        <ellipse cx="100" cy="104" rx="74" ry="68" fill="var(--bear)"/><ellipse cx="100" cy="134" rx="33" ry="25" fill="var(--muzzle)"/>
        <ellipse cx="58" cy="124" rx="10" ry="6" fill="var(--blush)" opacity=".55"/><ellipse cx="142" cy="124" rx="10" ry="6" fill="var(--blush)" opacity=".55"/>
        <g class="eyes-open"><ellipse cx="74" cy="102" rx="7.5" ry="9" fill="#2B1A12"/><circle cx="76.5" cy="99" r="2.6" fill="#fff"/><ellipse cx="126" cy="102" rx="7.5" ry="9" fill="#2B1A12"/><circle cx="128.5" cy="99" r="2.6" fill="#fff"/></g>
        <g class="eyes-happy" fill="none" stroke="#2B1A12" stroke-width="4.5" stroke-linecap="round"><path d="M65 104 Q74 92 83 104"/><path d="M117 104 Q126 92 135 104"/></g>
        <g class="eyes-sad" fill="none" stroke="#2B1A12" stroke-width="4" stroke-linecap="round"><path d="M65 100 Q74 108 83 100"/><path d="M117 100 Q126 108 135 100"/><path d="M62 86 L80 90"/><path d="M138 86 L120 90"/></g>
        <ellipse cx="100" cy="123" rx="10" ry="7" fill="#2B1A12"/><path d="M90 135 Q100 143 110 135" fill="none" stroke="#2B1A12" stroke-width="3.5" stroke-linecap="round"/>
        <g transform="translate(132 150) rotate(12)"><rect x="0" y="0" width="44" height="30" rx="5" fill="#FFFDF8" stroke="#E8DDD4" stroke-width="2"/><rect x="0" y="0" width="44" height="6" rx="3" fill="#F2B654"/><path d="M8 15 H36 M8 22 H28" stroke="#C9BBA9" stroke-width="2.5" stroke-linecap="round"/></g>
        <ellipse cx="146" cy="176" rx="13" ry="11" fill="var(--bear)"/>
      </g></svg>`;
  }
  const ICON = {
    back: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
    speak: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>',
  };

  /* ---------- Home ---------- */
  function dueCards() { return allCards().filter(isDue); }
  function newCards() { return allCards().filter(c => !st(c) && c.deck !== 'mine').concat(myDeck().cards.filter(c => !st(c))); }
  function renderHome() {
    const due = dueCards().length, newLeft = Math.max(0, Math.min(NEW_PER_DAY - S.newToday, newCards().length));
    const totalMastered = allCards().filter(mastered).length;
    app.innerHTML = `<div class="screen">
      <div class="top"><a class="back" href="index.html">${ICON.back}Browny</a><h1>Từ vựng</h1></div>
      <div class="today">${bear(due + newLeft ? 'idle' : 'happy')}<div class="info">
        <div class="label">Hôm nay</div>
        <div class="nums"><div><b>${due}</b><span>cần ôn</span></div><div><b>${newLeft}</b><span>từ mới</span></div><div><b>${totalMastered}</b><span>đã thuộc</span></div></div>
        <button class="btn" id="go" ${due + newLeft ? '' : 'disabled'}>${due + newLeft ? `Bắt đầu ${due + newLeft} thẻ` : 'Xong bài hôm nay rồi!'}</button>
      </div></div>
      <div class="legend"><span><i style="background:var(--mint)"></i>Đã thuộc</span><span><i style="background:var(--honey)"></i>Đang học</span><span><i style="background:var(--surface-2)"></i>Chưa học</span></div>
      <div class="decks">${allDecks().map(d => { const n = d.cards.length, m = d.cards.filter(mastered).length, l = d.cards.filter(learning).length;
        return `<div class="deck"><div class="deck-head"><span class="ic" style="background:${d.color}">${esc(d.cards[0].word[0].toUpperCase())}</span>
          <div><b>${esc(d.name)}</b><span class="soft">${n} từ · ${m} đã thuộc</span></div><span class="pct">${Math.round(m / n * 100)}%</span></div>
          <div class="track"><i class="m" style="width:${m / n * 100}%"></i><i class="l" style="width:${l / n * 100}%"></i></div>
          <div class="deck-actions"><button class="btn ghost small" data-study="${d.id}">Học thẻ</button><button class="btn ghost small" data-quiz="${d.id}" ${d.mine || n < 4 ? 'disabled' : ''}>Trắc nghiệm</button></div></div>`; }).join('')}</div>
      <p class="soft" style="text-align:center;margin:0">Thẻ bạn bấm "Nhớ rồi" sẽ quay lại sau 1, 3, 7, 14 rồi 30 ngày. Bấm "Chưa nhớ" thì thẻ quay lại ngay trong buổi học. Mỗi ngày có tối đa ${NEW_PER_DAY} từ mới.</p>
    </div>`;
    $('#go').onclick = () => {
      const quota = Math.max(0, NEW_PER_DAY - S.newToday);
      startStudy(shuffle(dueCards()).concat(newCards().slice(0, quota)), 'Ôn hôm nay', true);
    };
    app.querySelectorAll('[data-study]').forEach(b => b.onclick = () => { const d = deckOf(b.dataset.study); startStudy(shuffle(d.cards), d.name, false); });
    app.querySelectorAll('[data-quiz]').forEach(b => b.onclick = () => startQuiz(deckOf(b.dataset.quiz)));
  }

  /* ---------- Study (flashcards) ---------- */
  let run = null;
  function startStudy(queue, title, daily) {
    if (!queue.length) return toast('Không có thẻ nào để học');
    run = { queue: queue.slice(), title, daily, total: queue.length, done: 0, stats: [0, 0, 0], seen: new Set(), again: [] };
    renderCard(true);
  }
  function renderCard(first) {
    const c = run.queue[0];
    if (!c) return renderStudyEnd();
    const d = deckOf(c.deck), pct = run.done / run.total * 100;
    app.innerHTML = `<div class="screen">
      <div class="top"><button class="back" id="back">${ICON.back}Xong</button><h1>${esc(run.title)}</h1><span class="count">${run.done}/${run.total}</span></div>
      <div class="progress"><i style="width:${pct}%"></i></div>
      <div class="stage"><div class="fc in" id="fc" style="--deck:${d.color}">
        <div class="face front"><button class="speak" id="spk" aria-label="Nghe phát âm">${ICON.speak}</button>
          <div class="word">${esc(c.word)}</div>${c.pos ? `<div class="pos">${esc(c.pos)}</div>` : ''}
          ${!st(c) ? '<div class="label" style="color:var(--mint)">Từ mới</div>' : ''}
          <div class="hint">Chạm để lật thẻ</div></div>
        <div class="face back"><button class="speak" id="spk2" aria-label="Nghe phát âm">${ICON.speak}</button>
          <div class="w2">${esc(c.word)} ${c.pos ? `<span class="pos" style="font-size:15px">${esc(c.pos)}</span>` : ''}</div>
          <div class="vi">${esc(c.vi)}</div>
          ${c.syn ? `<div class="syn"><span>≈</span>${esc(c.syn)}</div>` : ''}
          ${c.ex ? `<div class="ex">${highlightWord(c.ex, c.word.split(' ')[0])}</div>` : c.from ? `<div class="ex">Lưu từ bài đọc "${esc(c.from)}"</div>` : ''}
        </div></div></div>
      <div class="rate" id="rate" hidden>
        <button class="r0" data-r="0">Chưa nhớ<small>học lại ngay</small></button>
        <button class="r1" data-r="1">Hơi nhớ<small>ngày mai</small></button>
        <button class="r2" data-r="2">Nhớ rồi<small>${INTERVAL[Math.min((st(c)?.box || 0) + 1, 5)]} ngày nữa</small></button>
      </div>
      <button class="btn ghost" id="flipBtn">Lật thẻ</button>
    </div>`;
    const fc = $('#fc');
    const flip = () => { fc.classList.toggle('flip'); if (fc.classList.contains('flip')) { $('#rate').hidden = false; $('#flipBtn').hidden = true; } };
    fc.onclick = e => { if (e.target.closest('.speak')) return; flip(); };
    $('#flipBtn').onclick = flip;
    $('#spk').onclick = () => speak(c.word); $('#spk2').onclick = () => speak(c.ex || c.word);
    $('#back').onclick = () => (run.done ? renderStudyEnd() : renderHome());
    app.querySelectorAll('#rate button').forEach(b => b.onclick = () => rate(c, +b.dataset.r));
  }
  function rate(c, r) {
    const now = Date.now(), s = st(c);
    if (!s && run.daily) S.newToday++;
    const box = s ? s.box : 0;
    let next;
    if (r === 0) next = { box: 0, due: now };
    else if (r === 1) next = { box: Math.max(1, Math.min(box, 2)), due: now + DAY };
    else { const nb = Math.min(box + 1, 5); next = { box: nb, due: now + INTERVAL[nb] * DAY }; }
    S.cards[c.id] = { ...next, seen: (s?.seen || 0) + 1 };
    S.reviewed++; save();
    if (!run.seen.has(c.id)) { run.stats[r]++; run.seen.add(c.id); }
    const fc = $('#fc');
    fc.classList.remove('in'); fc.classList.add(r === 0 ? 'out-left' : 'out-right');
    run.queue.shift();
    if (r === 0) { run.queue.splice(Math.min(3, run.queue.length), 0, c); if (!run.again.includes(c)) run.again.push(c); }
    else run.done++;
    setTimeout(() => renderCard(), 300);
  }
  function renderStudyEnd() {
    // Count a study session once it covered at least 5 cards; "Nhớ rồi" counts as a correct answer.
    if (run.done >= 5 && !run.rewarded) { run.rewarded = true; BrownyRewards.finish({ kind: 'vocab', correct: run.stats[2], total: run.stats[0] + run.stats[1] + run.stats[2] }); }
    const [a, b, c] = run.stats, good = c >= a + b;
    app.innerHTML = `<div class="screen result">
      ${bear(good ? 'happy' : 'idle')}
      <h1>${run.queue.length ? 'Tạm nghỉ nhé!' : good ? 'Giỏi quá!' : 'Hoàn thành!'}</h1>
      <div class="soft">${esc(run.title)} · đã xong ${run.done}/${run.total} thẻ</div>
      <div class="stats3"><div><b style="color:var(--mint)">${c}</b><span>Nhớ rồi</span></div><div><b style="color:var(--brown)">${b}</b><span>Hơi nhớ</span></div><div><b style="color:var(--coral)">${a}</b><span>Chưa nhớ</span></div></div>
      ${run.again.length ? `<div class="label" style="align-self:flex-start">Từ cần để ý</div><div class="list-words">${run.again.map(w => `<div class="lw"><b>${esc(w.word)}</b><span>${esc(w.vi)}</span></div>`).join('')}</div>` : ''}
      <button class="btn" id="home">Về trang Từ vựng</button>
    </div>`;
    if (good) setTimeout(() => confetti($('.result svg')), 300);
    $('#home').onclick = renderHome;
  }

  /* ---------- Quiz: "closest in meaning", like Reading vocab questions ---------- */
  function startQuiz(deck) {
    const pool = deck.cards.filter(c => c.syn);
    const items = shuffle(pool).slice(0, 10).map(c => {
      const others = shuffle(pool.filter(o => o.id !== c.id && o.syn !== c.syn)).map(o => o.syn).filter((v, i, a) => a.indexOf(v) === i).slice(0, 3);
      const options = shuffle([c.syn, ...others]);
      return { c, options, answer: options.indexOf(c.syn) };
    });
    run = { quiz: true, deck, items, i: 0, correct: 0, wrong: [] };
    renderQuiz();
  }
  function renderQuiz() {
    const it = run.items[run.i];
    if (!it) return renderQuizEnd();
    app.innerHTML = `<div class="screen">
      <div class="top"><button class="back" id="back">${ICON.back}Thoát</button><h1>Trắc nghiệm</h1><span class="count">${run.i + 1}/${run.items.length}</span></div>
      <div class="progress"><i style="width:${run.i / run.items.length * 100}%"></i></div>
      <div class="mini-bear">${bear('idle')}<div class="say">Giống câu hỏi từ vựng trong phần Reading đó!</div></div>
      <div class="qcard">
        <div class="qtext">The word <span class="qw">"${esc(it.c.word)}"</span> is closest in meaning to</div>
        <div class="qex">${highlightWord(it.c.ex, it.c.word.split(' ')[0])}</div>
        <div class="opts">${it.options.map((o, k) => `<button class="opt" data-k="${k}"><span class="k">${L[k]}</span>${esc(o)}</button>`).join('')}</div>
        <div id="fb"></div>
      </div>
      <button class="btn" id="next" hidden>${run.i < run.items.length - 1 ? 'Câu tiếp theo' : 'Xem kết quả'}</button>
    </div>`;
    $('#back').onclick = renderHome;
    app.querySelectorAll('.opt').forEach(b => b.onclick = () => {
      const k = +b.dataset.k, ok = k === it.answer, opts = app.querySelectorAll('.opt');
      opts.forEach(x => x.disabled = true);
      opts[it.answer].classList.add('right');
      BrownyRewards.answer(ok);
      if (!ok) { opts[k].classList.add('wrong'); run.wrong.push(it.c); $('.mini-bear .bear').setAttribute('data-mood', 'sad'); }
      else { run.correct++; confetti(opts[k]); $('.mini-bear .bear').setAttribute('data-mood', 'happy'); }
      $('.mini-bear .say').textContent = ok ? 'Chuẩn luôn!' : 'Không sao, nhớ từ này nhé.';
      $('#fb').innerHTML = `<div class="fb ${ok ? 'ok' : 'no'}"><b>${esc(it.c.word)}</b> = ${esc(it.c.vi)} ≈ <b>${esc(it.c.syn)}</b></div>`;
      $('#next').hidden = false;
    });
    $('#next').onclick = () => { run.i++; renderQuiz(); };
  }
  function renderQuizEnd() {
    if (!run.rewarded) { run.rewarded = true; BrownyRewards.finish({ kind: 'quiz', correct: run.correct, total: run.items.length }); }
    const n = run.items.length, good = run.correct / n >= .8;
    app.innerHTML = `<div class="screen result">
      ${bear(good ? 'happy' : 'idle')}
      <div class="big">${run.correct}/${n}</div>
      <h1>${good ? 'Xuất sắc!' : 'Luyện thêm chút nữa nhé'}</h1>
      <div class="soft">${esc(run.deck.name)}</div>
      ${run.wrong.length ? `<div class="label" style="align-self:flex-start">Từ làm sai</div><div class="list-words">${run.wrong.map(w => `<div class="lw"><b>${esc(w.word)}</b><span>${esc(w.vi)} ≈ ${esc(w.syn)}</span></div>`).join('')}</div>
        <button class="btn ghost" id="studyWrong">Học thẻ các từ làm sai</button>` : ''}
      <button class="btn" id="home">Về trang Từ vựng</button>
    </div>`;
    if (good) setTimeout(() => confetti($('.result svg')), 300);
    $('#home').onclick = renderHome;
    const sw = $('#studyWrong'); if (sw) sw.onclick = () => startStudy(run.wrong.slice(), 'Từ làm sai', false);
  }

  renderHome();
})();
</script>
</body>
</html>
