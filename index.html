<title>Browny</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;600;700;800&display=swap">
<style>
/* Layout: one phone-width column, a soft "honey milk" ground, brownie bear as the only strong colour; mint = correct, coral = wrong. */
:root {
  --bg: #FBF7F4;
  --surface: #FFFFFF;
  --surface-2: #F3ECE6;
  --line: #E8DDD4;
  --fg: #3B2A21;
  --fg-soft: #87736A;
  --brown: #7B4B2E;
  --brown-deep: #5A3420;
  --honey: #F2B654;
  --mint: #4FB98F;
  --mint-soft: #E2F5EC;
  --coral: #E9705E;
  --coral-soft: #FCE8E4;
  --locked: #CFC3BA;
  --bear: #8A5636;
  --bear-light: #C08A63;
  --muzzle: #E9C9A8;
  --blush: #F49A8E;
  --shadow: 0 6px 0 var(--line);
  --font-display: "Fredoka", "Nunito", ui-rounded, system-ui, sans-serif;
  --font-body: "Nunito", ui-rounded, system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 22px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1E1814; --surface: #2A221D; --surface-2: #352B25; --line: #46392F;
    --fg: #F5EAE2; --fg-soft: #B5A398; --brown: #D9A07A; --brown-deep: #F0C3A2;
    --honey: #F2B654; --mint: #5FCB9F; --mint-soft: #1F3A2F; --coral: #F08472; --coral-soft: #452722;
    --locked: #5A4C43; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1E1814; --surface: #2A221D; --surface-2: #352B25; --line: #46392F;
  --fg: #F5EAE2; --fg-soft: #B5A398; --brown: #D9A07A; --brown-deep: #F0C3A2;
  --honey: #F2B654; --mint: #5FCB9F; --mint-soft: #1F3A2F; --coral: #F08472; --coral-soft: #452722;
  --locked: #5A4C43; color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 16px; line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
button:focus-visible { outline: 3px solid var(--honey); outline-offset: 3px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 600; margin: 0; text-wrap: balance; letter-spacing: .2px; }

#app {
  max-width: 460px; margin: 0 auto; min-height: 100%;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px 110px;
  position: relative;
}
.screen { animation: screenIn .35s cubic-bezier(.2,.9,.3,1.2) both; display: flex; flex-direction: column; gap: 18px; }
@keyframes screenIn { from { opacity: 0; transform: translateY(14px) scale(.98); } }

/* ---------- Bear ---------- */
.bear { display: block; overflow: visible; }
.bear .eyes-happy, .bear .eyes-sleep, .bear .brows, .bear .mouth-open, .bear .zz { display: none; }
.bear[data-mood="happy"] .eyes-open, .bear[data-mood="cheer"] .eyes-open,
.bear[data-mood="sleep"] .eyes-open { display: none; }
.bear[data-mood="happy"] .eyes-happy, .bear[data-mood="cheer"] .eyes-happy { display: inline; }
.bear[data-mood="happy"] .mouth-open, .bear[data-mood="cheer"] .mouth-open { display: inline; }
.bear[data-mood="happy"] .mouth, .bear[data-mood="cheer"] .mouth { display: none; }
.bear[data-mood="sad"] .brows { display: inline; }
.bear[data-mood="sleep"] .eyes-sleep, .bear[data-mood="sleep"] .zz { display: inline; }

.bear .eyes-open { transform-box: fill-box; transform-origin: center; animation: blink 4.2s infinite; }
@keyframes blink { 0%, 93%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.1); } }
.bear .body-all { transform-box: fill-box; transform-origin: 50% 100%; animation: breathe 3.2s ease-in-out infinite; }
@keyframes breathe { 50% { transform: scale(1.025, .985); } }
.bear .ear-l, .bear .ear-r { transform-box: fill-box; transform-origin: 50% 90%; }
.bear[data-mood="idle"] .ear-r { animation: earTwitch 6s infinite; }
@keyframes earTwitch { 0%, 88%, 100% { transform: rotate(0); } 91% { transform: rotate(12deg); } 94% { transform: rotate(-4deg); } }
.bear .paw-r { transform-box: fill-box; transform-origin: 30% 80%; }

.bear[data-mood="happy"] .body-all { animation: hop .7s cubic-bezier(.3,1.6,.5,1) 1; }
@keyframes hop { 0% { transform: translateY(0) scale(1); } 25% { transform: translateY(2px) scale(1.06,.92); } 55% { transform: translateY(-22px) scale(.96,1.05); } 80% { transform: translateY(0) scale(1.04,.96); } 100% { transform: none; } }
.bear[data-mood="cheer"] .body-all { animation: sway 1.4s ease-in-out infinite; }
.bear[data-mood="cheer"] .paw-r { animation: wave .6s ease-in-out infinite alternate; }
@keyframes sway { 50% { transform: rotate(-4deg) translateY(-4px); } }
@keyframes wave { from { transform: rotate(0); } to { transform: rotate(-38deg); } }
.bear[data-mood="wave"] .paw-r { animation: wave .35s ease-in-out 4 alternate; }
.bear[data-mood="sad"] .body-all { animation: tilt .9s ease-out 1 forwards; }
@keyframes tilt { 30% { transform: rotate(-9deg); } 60% { transform: rotate(-5deg); } 100% { transform: rotate(-7deg); } }
.bear[data-mood="sleep"] .body-all { animation: snooze 3.6s ease-in-out infinite; }
@keyframes snooze { 50% { transform: rotate(5deg) translateY(2px); } }
.bear .zz text { animation: zz 2.4s ease-in-out infinite; transform-box: fill-box; }
.bear .zz text:nth-child(2) { animation-delay: 1.2s; }
@keyframes zz { 0% { opacity: 0; transform: translate(0,0) scale(.6); } 30% { opacity: 1; } 100% { opacity: 0; transform: translate(14px,-26px) scale(1.1); } }

/* ---------- Header ---------- */
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.wordmark { font-family: var(--font-display); font-weight: 700; font-size: 26px; color: var(--brown); display: flex; align-items: center; gap: 8px; }
.wordmark svg { width: 34px; height: 34px; }
.chips { display: flex; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 6px 12px; border-radius: 999px; background: var(--surface); border: 2px solid var(--line); font-weight: 800; font-size: 14px; font-variant-numeric: tabular-nums; }
.chip svg { width: 18px; height: 18px; }
.flame { transform-origin: 50% 90%; animation: flicker 1.6s ease-in-out infinite; }
@keyframes flicker { 50% { transform: scale(1.08, .94) rotate(-3deg); } }

/* ---------- Hero ---------- */
.hero { display: grid; grid-template-columns: 128px 1fr; gap: 10px; align-items: end; padding: 18px 18px 0; background: var(--surface); border: 2px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; }
.hero .bear-btn { display: block; padding: 0; }
.hero .bear { width: 128px; height: 140px; }
.bubble { position: relative; align-self: center; background: var(--surface-2); border-radius: 18px; padding: 12px 14px; font-weight: 700; font-size: 15px; margin-bottom: 18px; min-width: 0; }
.bubble::before { content: ""; position: absolute; left: -8px; bottom: 18px; border: 8px solid transparent; border-right-color: var(--surface-2); border-left: 0; }
.bubble.pop { animation: pop .35s cubic-bezier(.3,1.7,.5,1); }
@keyframes pop { from { transform: scale(.85); opacity: .4; } }

.score { padding: 16px 18px; background: var(--surface); border: 2px solid var(--line); border-radius: var(--r); display: flex; flex-direction: column; gap: 10px; }
.score-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.label { font-size: 12px; font-weight: 800; letter-spacing: .8px; text-transform: uppercase; color: var(--fg-soft); }
.score-num { font-family: var(--font-display); font-size: 34px; font-weight: 700; color: var(--brown); line-height: 1; font-variant-numeric: tabular-nums; }
.score-goal { font-weight: 700; color: var(--fg-soft); font-size: 14px; }
.scale { position: relative; height: 14px; background: var(--surface-2); border-radius: 999px; }
.scale-fill { position: absolute; inset: 0 auto 0 0; border-radius: 999px; background: var(--honey); width: 0; transition: width 1.1s cubic-bezier(.2,.9,.3,1.1); }
.scale-goal { position: absolute; top: -5px; width: 4px; height: 24px; border-radius: 2px; background: var(--brown); }
.scale-ticks { display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; color: var(--fg-soft); font-variant-numeric: tabular-nums; }

.btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 16px 20px; border-radius: 18px; font-weight: 800; font-size: 17px; background: var(--brown); color: #FFF8F2; box-shadow: 0 5px 0 var(--brown-deep); transition: transform .08s, box-shadow .08s; }
.btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--brown-deep); }
.btn.ghost { background: var(--surface); color: var(--fg); border: 2px solid var(--line); box-shadow: 0 5px 0 var(--line); }
.btn.mint { background: var(--mint); box-shadow: 0 5px 0 color-mix(in srgb, var(--mint) 60%, #000); color: #fff; }
.btn.coral { background: var(--coral); box-shadow: 0 5px 0 color-mix(in srgb, var(--coral) 60%, #000); color: #fff; }
.btn[disabled] { background: var(--locked); box-shadow: 0 5px 0 var(--line); cursor: not-allowed; color: var(--surface); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn:not(.ghost):not(.mint):not(.coral) { color: #2A1A10; } }
:root[data-theme="dark"] .btn:not(.ghost):not(.mint):not(.coral) { color: #2A1A10; }

/* ---------- Skills ---------- */
.section-head { display: flex; justify-content: space-between; align-items: baseline; margin-top: 4px; }
.section-head h2 { font-size: 20px; }
.skills { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.skill { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 4px 10px; border-radius: 18px; background: var(--surface); border: 2px solid var(--line); font-weight: 800; font-size: 12.5px; transition: transform .15s; position: relative; }
.skill:hover { transform: translateY(-3px) rotate(-1.5deg); }
.skill .ic { width: 42px; height: 42px; border-radius: 14px; display: grid; place-items: center; }
.skill .ic svg { width: 24px; height: 24px; }
.skill.soon { color: var(--fg-soft); }
.skill.soon .ic { filter: grayscale(.7); opacity: .65; }
.skill .tag { position: absolute; top: -8px; right: -4px; background: var(--honey); color: #3B2A21; font-size: 10px; padding: 1px 6px; border-radius: 999px; }

/* ---------- Path ---------- */
.path { position: relative; display: flex; flex-direction: column; gap: 6px; padding: 6px 0 10px; }
.path svg.trail { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.stop { position: relative; display: flex; align-items: center; gap: 14px; width: 78%; z-index: 1; }
.stop:nth-child(odd) { align-self: flex-start; }
.stop:nth-child(even) { align-self: flex-end; flex-direction: row-reverse; text-align: right; }
.node { flex: none; width: 66px; height: 62px; border-radius: 50%; display: grid; place-items: center; background: var(--locked); box-shadow: 0 6px 0 color-mix(in srgb, var(--locked) 70%, #000); color: #fff; transition: transform .12s; }
.node svg { width: 28px; height: 28px; }
.stop.done .node { background: var(--honey); box-shadow: 0 6px 0 #C98E2E; color: #5A3420; }
.stop.current .node { background: var(--brown); box-shadow: 0 6px 0 var(--brown-deep); color: #FFF8F2; animation: nodePulse 1.8s ease-in-out infinite; }
@keyframes nodePulse { 0%, 100% { outline: 0 solid color-mix(in srgb, var(--brown) 35%, transparent); } 50% { outline: 10px solid color-mix(in srgb, var(--brown) 0%, transparent); } }
.stop.current .node { outline-offset: 2px; }
.stop:not(.locked) .node:active { transform: translateY(5px); box-shadow: none; }
.stop-text { min-width: 0; }
.stop-text b { display: block; font-size: 15px; }
.stop-text span { font-size: 13px; color: var(--fg-soft); font-weight: 600; }
.stop.locked .stop-text b { color: var(--fg-soft); }
.start-flag { position: absolute; top: -26px; left: 6px; background: var(--fg); color: var(--bg); font-size: 11px; font-weight: 800; letter-spacing: .6px; padding: 3px 9px; border-radius: 8px; text-transform: uppercase; animation: bob 1.4s ease-in-out infinite; white-space: nowrap; }
.stop:nth-child(even) .start-flag { left: auto; right: 6px; }
@keyframes bob { 50% { transform: translateY(-4px); } }

/* ---------- Nav ---------- */
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); border-top: 2px solid var(--line); padding: 8px max(16px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.nav-inner { max-width: 460px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.nav button { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px; border-radius: 14px; font-size: 12px; font-weight: 800; color: var(--fg-soft); position: relative; }
.nav button svg { width: 26px; height: 26px; }
.nav button.on { color: var(--brown); background: var(--surface-2); }
.nav .badge { position: absolute; top: 2px; right: calc(50% - 22px); min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px; background: var(--coral); color: #fff; font-size: 11px; display: grid; place-items: center; }

/* ---------- Practice ---------- */
.q-top { display: flex; align-items: center; gap: 12px; }
.icon-btn { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; color: var(--fg-soft); flex: none; }
.icon-btn:hover { background: var(--surface-2); }
.icon-btn svg { width: 24px; height: 24px; }
.progress { flex: 1; height: 16px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--mint); border-radius: 999px; transition: width .5s cubic-bezier(.3,1.5,.5,1); position: relative; }
.progress i::after { content: ""; position: absolute; left: 8px; right: 8px; top: 3px; height: 4px; border-radius: 4px; background: rgba(255,255,255,.4); }
.q-count { font-weight: 800; font-size: 14px; color: var(--fg-soft); font-variant-numeric: tabular-nums; }
.q-kind { align-self: flex-start; font-size: 12px; font-weight: 800; letter-spacing: .6px; text-transform: uppercase; padding: 4px 10px; border-radius: 999px; background: var(--surface-2); color: var(--brown); }
.q-ask { font-weight: 700; color: var(--fg-soft); font-size: 14px; margin: -6px 0 0; }
.q-row { display: grid; grid-template-columns: 1fr 86px; gap: 8px; align-items: end; }
.q-text { font-size: 19px; font-weight: 700; line-height: 1.6; background: var(--surface); border: 2px solid var(--line); border-radius: var(--r); padding: 18px; min-width: 0; }
.blank { display: inline-block; min-width: 70px; border-bottom: 3px solid var(--brown); margin: 0 2px; }
.seg { position: relative; text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 5px; text-decoration-color: var(--brown); }
.seg sub { font-family: var(--font-display); font-size: 11px; color: var(--brown); font-weight: 700; margin-left: 1px; }
.seg.bad { background: var(--coral-soft); border-radius: 6px; text-decoration-color: var(--coral); }
.q-row .bear { width: 86px; height: 96px; }
.options { display: grid; gap: 10px; }
.opt { display: flex; align-items: center; gap: 12px; text-align: left; padding: 14px 16px; border-radius: 18px; background: var(--surface); border: 2px solid var(--line); box-shadow: 0 4px 0 var(--line); font-weight: 700; font-size: 16px; transition: transform .08s, border-color .15s, background .15s; }
.opt:hover:not([disabled]) { border-color: var(--bear-light); }
.opt:active:not([disabled]) { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
.opt .key { flex: none; width: 30px; height: 30px; border-radius: 10px; display: grid; place-items: center; border: 2px solid var(--line); font-family: var(--font-display); font-size: 14px; color: var(--fg-soft); }
.opt.sel { border-color: var(--brown); background: var(--surface-2); }
.opt.sel .key { border-color: var(--brown); color: var(--brown); }
.opt.right { border-color: var(--mint); background: var(--mint-soft); box-shadow: 0 4px 0 var(--mint); animation: rightPop .45s cubic-bezier(.3,1.8,.5,1); }
.opt.right .key { background: var(--mint); border-color: var(--mint); color: #fff; }
.opt.wrong { border-color: var(--coral); background: var(--coral-soft); box-shadow: 0 4px 0 var(--coral); animation: shake .45s; }
.opt.wrong .key { background: var(--coral); border-color: var(--coral); color: #fff; }
.opt[disabled] { cursor: default; }
@keyframes rightPop { 40% { transform: scale(1.04); } }
@keyframes shake { 20%, 60% { transform: translateX(-7px); } 40%, 80% { transform: translateX(7px); } }

.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; padding: 18px max(16px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); border-top: 2px solid var(--line); background: var(--surface); transform: translateY(105%); transition: transform .35s cubic-bezier(.2,1.2,.4,1); }
.sheet.show { transform: none; }
.sheet.ok { background: var(--mint-soft); border-color: var(--mint); }
.sheet.no { background: var(--coral-soft); border-color: var(--coral); }
.sheet-inner { max-width: 460px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
.sheet h3 { font-size: 22px; display: flex; align-items: center; gap: 8px; }
.sheet.ok h3 { color: var(--mint); }
.sheet.no h3 { color: var(--coral); }
.sheet p { margin: 0; font-weight: 600; font-size: 15px; }
.sheet .ans { font-weight: 800; }
.sheet-spacer { height: 0; transition: height .35s; }

.xp-float { position: fixed; z-index: 40; font-family: var(--font-display); font-weight: 700; font-size: 22px; color: var(--honey); pointer-events: none; animation: xpUp 1s ease-out forwards; text-shadow: 0 2px 0 rgba(0,0,0,.08); }
@keyframes xpUp { 0% { opacity: 0; transform: translateY(0) scale(.7); } 20% { opacity: 1; transform: translateY(-8px) scale(1.15); } 100% { opacity: 0; transform: translateY(-60px) scale(1); } }
.confetti { position: fixed; z-index: 39; width: 9px; height: 9px; border-radius: 3px; pointer-events: none; animation: burst .9s cubic-bezier(.2,.7,.4,1) forwards; }
@keyframes burst { 0% { transform: translate(0,0) rotate(0) scale(1); opacity: 1; } 100% { transform: translate(var(--dx), var(--dy)) rotate(var(--rot)) scale(.6); opacity: 0; } }

/* ---------- Result ---------- */
.result { align-items: center; text-align: center; padding-top: 20px; }
.result .bear { width: 170px; height: 186px; }
.result h1 { font-size: 30px; }
.result .sub { color: var(--fg-soft); font-weight: 700; margin-top: -10px; }
.stars { display: flex; gap: 8px; justify-content: center; }
.stars svg { width: 54px; height: 54px; opacity: 0; transform: scale(0) rotate(-40deg); animation: starIn .5s cubic-bezier(.3,1.8,.5,1) forwards; }
.stars svg:nth-child(2) { width: 66px; height: 66px; margin-top: -12px; }
@keyframes starIn { to { opacity: 1; transform: none; } }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; }
.stat { border: 2px solid var(--line); border-radius: 18px; padding: 10px 6px; background: var(--surface); display: flex; flex-direction: column; gap: 2px; }
.stat b { font-family: var(--font-display); font-size: 24px; color: var(--brown); font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; font-weight: 800; color: var(--fg-soft); text-transform: uppercase; letter-spacing: .5px; }
.actions { display: flex; flex-direction: column; gap: 14px; width: 100%; margin-top: 4px; }

/* ---------- Mistakes ---------- */
.empty { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 24px 10px; color: var(--fg-soft); font-weight: 700; }
.empty .bear { width: 140px; height: 150px; }
.empty h2 { color: var(--fg); }
.mist { border: 2px solid var(--line); background: var(--surface); border-radius: 18px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
.mist .q { font-weight: 700; }
.mist .meta { display: flex; gap: 8px; flex-wrap: wrap; font-size: 13px; font-weight: 800; }
.pill { padding: 2px 9px; border-radius: 999px; }
.pill.no { background: var(--coral-soft); color: var(--coral); }
.pill.ok { background: var(--mint-soft); color: var(--mint); }
.pill.kind { background: var(--surface-2); color: var(--brown); }
.mist p { margin: 0; font-size: 14px; color: var(--fg-soft); font-weight: 600; }
.lead { margin: -8px 0 0; color: var(--fg-soft); font-weight: 600; }

.toast { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); z-index: 50; transform: translate(-50%, 20px); opacity: 0; background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 14px; font-weight: 800; font-size: 14px; transition: .25s cubic-bezier(.3,1.5,.5,1); pointer-events: none; max-width: calc(100% - 32px); text-align: center; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ---------- Intro, info, test ---------- */
.note { margin: 0; font-size: 12.5px; color: var(--fg-soft); font-weight: 600; text-align: center; line-height: 1.45; }
.intro-hero { display: grid; grid-template-columns: 110px 1fr; gap: 10px; align-items: end; }
.intro-hero .bear { width: 110px; height: 120px; }
.tips { display: flex; flex-direction: column; gap: 10px; }
.tips h3 { font-size: 18px; }
.tip { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: 18px; background: var(--surface); border: 2px solid var(--line); font-weight: 600; animation: screenIn .4s cubic-bezier(.2,.9,.3,1.2) both; }
.tip-n { flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--honey); color: #3B2A21; font-family: var(--font-display); font-weight: 700; }
.table-wrap { overflow-x: auto; border: 2px solid var(--line); border-radius: 18px; background: var(--surface); }
.fmt { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
.fmt th, .fmt td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
.fmt td:first-child { white-space: normal; font-weight: 700; }
.fmt th { font-size: 11px; text-transform: uppercase; letter-spacing: .6px; color: var(--fg-soft); }
.fmt tr.total td { border-bottom: 0; font-weight: 800; color: var(--brown); }
.clock { font-weight: 800; font-size: 14px; padding: 3px 9px; border-radius: 999px; background: var(--surface-2); color: var(--brown); font-variant-numeric: tabular-nums; }
.clock.low { background: var(--coral-soft); color: var(--coral); animation: bob 1s ease-in-out infinite; }
.est { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 14px; border-radius: 18px; background: var(--surface-2); }
.est b { font-family: var(--font-display); font-size: 40px; line-height: 1.1; color: var(--brown); }
.est span:last-child { font-size: 13px; font-weight: 700; color: var(--fg-soft); }

@media (max-width: 380px) {
  .skills { grid-template-columns: repeat(2, 1fr); }
  .hero { grid-template-columns: 104px 1fr; }
  .hero .bear { width: 104px; height: 116px; }
  .q-row { grid-template-columns: 1fr; }
  .q-row .bear { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
}
</style>

<div id="app"></div>
<nav class="nav" id="nav" hidden>
  <div class="nav-inner">
    <button data-tab="home" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z"/></svg>Học</button>
    <button data-tab="mistakes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h11l3 3v13H5z"/><path d="M9 10h6M9 14h6"/></svg>Sổ lỗi sai<span class="badge" id="mbadge" hidden>0</span></button>
    <button data-tab="mock"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="7"/><path d="M12 9v4l2.5 2M9 3h6"/></svg>Thi thử</button>
  </div>
</nav>
<div class="sheet" id="sheet"><div class="sheet-inner" id="sheetInner"></div></div>
<div class="toast" id="toast"></div>

<script src="questions.js"></script>
<script>
(() => {
  /* ---------------- Data (questions.js) ---------------- */
  const BANK = window.BROWNY_BANK || { questions: [], stations: [] };
  const QUESTIONS = BANK.questions;
  const STOPS = BANK.stations;
  const byId = Object.fromEntries(QUESTIONS.map(q => [q.id, q]));
  const shuffle = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

  const CHEERS_IDLE = [
    'Chào bạn! Hôm nay học một trạm nhé?',
    'Mỗi ngày 15 phút là đủ rồi đó.',
    'Bạn còn cách mục tiêu không xa đâu!',
    'Mẹo: Structure luôn cần đủ chủ ngữ và động từ.',
    'Gấu Browny tin bạn làm được!',
  ];
  const CHEERS_OK = ['Chuẩn luôn!', 'Giỏi quá!', 'Tuyệt vời!', 'Đúng rồi nè!', 'Quá xịn!'];
  const CHEERS_NO = ['Suýt nữa thôi', 'Không sao đâu', 'Lần sau sẽ đúng', 'Học thêm một mẹo nữa'];

  /* ---------------- State ---------------- */
  const KEY = 'browny-demo-v2';
  const defaults = { xp: 120, streak: 3, stopDone: 1, score: 437, goal: 550, mistakes: [] };
  let S = { ...defaults };
  try { const raw = localStorage.getItem(KEY); if (raw) S = { ...defaults, ...JSON.parse(raw) }; } catch (e) {}
  S.mistakes = S.mistakes.filter(id => byId[id]);
  S.stopDone = Math.min(S.stopDone, STOPS.length);
  let timer = null;
  const stopTimer = () => { clearInterval(timer); timer = null; };
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };

  let run = null; // current practice session

  /* ---------------- Helpers ---------------- */
  const $ = s => document.querySelector(s);
  const app = $('#app');
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  function bear(mood = 'idle', id = '') {
    return `<svg class="bear" ${id ? `id="${id}"` : ''} data-mood="${mood}" viewBox="0 0 200 220" aria-label="Gấu Browny" role="img">
      <g class="body-all">
        <ellipse cx="100" cy="196" rx="54" ry="30" fill="var(--bear)"/>
        <ellipse cx="100" cy="200" rx="30" ry="18" fill="var(--muzzle)" opacity=".7"/>
        <ellipse class="paw-l" cx="62" cy="196" rx="15" ry="13" fill="var(--bear)"/>
        <g class="paw-r"><ellipse cx="138" cy="196" rx="15" ry="13" fill="var(--bear)"/><ellipse cx="138" cy="199" rx="7" ry="5" fill="var(--bear-light)"/></g>
        <g class="ear-l"><circle cx="50" cy="52" r="27" fill="var(--bear)"/><circle cx="50" cy="54" r="14" fill="var(--bear-light)"/></g>
        <g class="ear-r"><circle cx="150" cy="52" r="27" fill="var(--bear)"/><circle cx="150" cy="54" r="14" fill="var(--bear-light)"/></g>
        <ellipse cx="100" cy="104" rx="74" ry="68" fill="var(--bear)"/>
        <ellipse cx="100" cy="134" rx="33" ry="25" fill="var(--muzzle)"/>
        <ellipse cx="56" cy="124" rx="11" ry="7" fill="var(--blush)" opacity=".55"/>
        <ellipse cx="144" cy="124" rx="11" ry="7" fill="var(--blush)" opacity=".55"/>
        <g class="eyes-open">
          <ellipse cx="72" cy="100" rx="7.5" ry="9.5" fill="#2B1A12"/><circle cx="74.5" cy="96.5" r="2.8" fill="#fff"/>
          <ellipse cx="128" cy="100" rx="7.5" ry="9.5" fill="#2B1A12"/><circle cx="130.5" cy="96.5" r="2.8" fill="#fff"/>
        </g>
        <g class="eyes-happy" fill="none" stroke="#2B1A12" stroke-width="4.5" stroke-linecap="round">
          <path d="M63 103 Q72 91 81 103"/><path d="M119 103 Q128 91 137 103"/>
        </g>
        <g class="eyes-sleep" fill="none" stroke="#2B1A12" stroke-width="4" stroke-linecap="round">
          <path d="M63 101 Q72 108 81 101"/><path d="M119 101 Q128 108 137 101"/>
        </g>
        <g class="brows" fill="none" stroke="#2B1A12" stroke-width="3.5" stroke-linecap="round">
          <path d="M62 84 L80 89"/><path d="M138 84 L120 89"/>
        </g>
        <ellipse cx="100" cy="123" rx="10" ry="7" fill="#2B1A12"/>
        <ellipse cx="97" cy="121" rx="3" ry="1.8" fill="#fff" opacity=".6"/>
        <path class="mouth" d="M90 135 Q100 144 110 135" fill="none" stroke="#2B1A12" stroke-width="3.5" stroke-linecap="round"/>
        <path class="mouth-open" d="M89 133 Q100 133 111 133 Q109 149 100 149 Q91 149 89 133Z" fill="#7A2E2A" stroke="#2B1A12" stroke-width="3" stroke-linejoin="round"/>
        <g class="zz" font-family="Fredoka, sans-serif" font-weight="700" fill="var(--brown)"><text x="150" y="30" font-size="22">z</text><text x="166" y="18" font-size="16">z</text></g>
      </g>
    </svg>`;
  }

  function setMood(el, mood, back = null, ms = 900) {
    if (!el) return;
    el.setAttribute('data-mood', 'none');
    void el.getBoundingClientRect();
    el.setAttribute('data-mood', mood);
    if (back) setTimeout(() => el.isConnected && el.setAttribute('data-mood', back), ms);
  }

  let toastT;
  function toast(msg) {
    const t = $('#toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 1800);
  }

  function confetti(x, y) {
    const colors = ['var(--honey)', 'var(--mint)', 'var(--coral)', 'var(--bear-light)', '#9BC8F2'];
    for (let i = 0; i < 18; i++) {
      const c = document.createElement('i');
      c.className = 'confetti';
      const a = Math.random() * Math.PI * 2, d = 50 + Math.random() * 80;
      c.style.cssText = `left:${x}px;top:${y}px;background:${pick(colors)};--dx:${Math.cos(a) * d}px;--dy:${Math.sin(a) * d - 30}px;--rot:${Math.random() * 540 - 270}deg;border-radius:${Math.random() > .5 ? '50%' : '3px'}`;
      document.body.appendChild(c);
      setTimeout(() => c.remove(), 950);
    }
  }
  function xpFloat(x, y, n) {
    const f = document.createElement('div');
    f.className = 'xp-float'; f.textContent = `+${n} XP`;
    f.style.left = `${x - 30}px`; f.style.top = `${y - 20}px`;
    document.body.appendChild(f); setTimeout(() => f.remove(), 1000);
  }

  const ICON = {
    flame: '<svg viewBox="0 0 24 24"><path class="flame" d="M12 2c1 4 5 5.5 5 10.5A5 5 0 0 1 7 12.5c0-2 1-3.5 2-4.5 0 2 1 3 2 3 0-3-1-6 1-9z" fill="#F2884B"/><path d="M12 13c.6 1.6 2 2.2 2 4a2 2 0 0 1-4 0c0-1.2.8-2 2-4z" fill="#F2B654"/></svg>',
    star: '<svg viewBox="0 0 24 24"><path d="M12 2.5l2.9 6 6.6.8-4.9 4.5 1.3 6.5L12 17l-5.9 3.3 1.3-6.5L2.5 9.3l6.6-.8z" fill="#F2B654"/></svg>',
    check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
    lock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>',
    play: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.9l10-6.5a1 1 0 0 0 0-1.7l-10-6.5A1 1 0 0 0 8 5.5z"/></svg>',
    trophy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4h8v5a4 4 0 0 1-8 0zM8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4M12 13v4M8 20h8"/></svg>',
    close: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  };
  const bigStar = '<svg viewBox="0 0 24 24"><path d="M12 2.5l2.9 6 6.6.8-4.9 4.5 1.3 6.5L12 17l-5.9 3.3 1.3-6.5L2.5 9.3l6.6-.8z" fill="#F2B654" stroke="#D99A35" stroke-width="1.2" stroke-linejoin="round"/></svg>';
  const dimStar = '<svg viewBox="0 0 24 24"><path d="M12 2.5l2.9 6 6.6.8-4.9 4.5 1.3 6.5L12 17l-5.9 3.3 1.3-6.5L2.5 9.3l6.6-.8z" fill="var(--surface-2)" stroke="var(--line)" stroke-width="1.2" stroke-linejoin="round"/></svg>';

  const SKILLS = [
    { name: 'Listening', bg: '#DCEBFA', live: true, svg: '<svg viewBox="0 0 24 24" fill="none" stroke="#3E7CC0" stroke-width="2.4" stroke-linecap="round"><path d="M4 14v-2a8 8 0 0 1 16 0v2"/><rect x="3" y="14" width="4.5" height="6" rx="2" fill="#3E7CC0"/><rect x="16.5" y="14" width="4.5" height="6" rx="2" fill="#3E7CC0"/></svg>' },
    { name: 'Structure', bg: '#F6E3D4', live: true, svg: '<svg viewBox="0 0 24 24" fill="none" stroke="#7B4B2E" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l4-1 11-11-3-3L5 16z"/><path d="M14 7l3 3"/></svg>' },
    { name: 'Reading', bg: '#DDF2E7', svg: '<svg viewBox="0 0 24 24" fill="none" stroke="#2F9468" stroke-width="2.4" stroke-linejoin="round"><path d="M3 5c3-1 6-1 9 1v14c-3-2-6-2-9-1zM21 5c-3-1-6-1-9 1v14c3-2 6-2 9-1z"/></svg>' },
    { name: 'Từ vựng', bg: '#FBEBCB', svg: '<svg viewBox="0 0 24 24" fill="none" stroke="#C48A1E" stroke-width="2.4" stroke-linejoin="round"><rect x="4" y="6" width="13" height="15" rx="2.5"/><path d="M8 3h10a2 2 0 0 1 2 2v12"/></svg>' },
  ];

  /* ---------------- Screens ---------------- */
  let tab = 'home';

  function showNav(on) {
    $('#nav').hidden = !on;
    document.querySelectorAll('.nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
    const mb = $('#mbadge'); mb.hidden = !S.mistakes.length; mb.textContent = S.mistakes.length;
  }

  function renderHome() {
    tab = 'home'; showNav(true);
    const pct = v => ((v - 310) / (677 - 310)) * 100;
    app.innerHTML = `<div class="screen">
      <header class="topbar">
        <div class="wordmark">${bear('idle').replace('class="bear"', 'class="bear" style="width:34px;height:36px"')}Browny</div>
        <div class="chips">
          <span class="chip" title="Chuỗi ngày học">${ICON.flame}${S.streak}</span>
          <span class="chip" title="Điểm kinh nghiệm">${ICON.star}${S.xp}</span>
        </div>
      </header>

      <section class="hero">
        <button class="bear-btn" id="heroBear" aria-label="Chạm vào Browny">${bear('wave', 'bigBear')}</button>
        <div class="bubble" id="bubble">${CHEERS_IDLE[0]}</div>
      </section>

      <section class="score" aria-label="Điểm dự đoán">
        <div class="score-top">
          <div><div class="label">Điểm ITP dự đoán</div><div class="score-num" id="scoreNum">310</div></div>
          <div class="score-goal">Mục tiêu ${S.goal} · B2</div>
        </div>
        <div class="scale"><div class="scale-fill" id="scaleFill"></div><div class="scale-goal" style="left:calc(${pct(S.goal)}% - 2px)"></div></div>
        <div class="scale-ticks"><span>310</span><span>460 B1</span><span>543 B2</span><span>677</span></div>
      </section>

      <button class="btn" id="go">${ICON.play.replace('<svg', '<svg width="20" height="20"')}Tiếp tục: ${STOPS[Math.min(S.stopDone, STOPS.length - 1)].title}</button>

      <div class="section-head"><h2>Luyện kỹ năng</h2></div>
      <div class="skills">
        ${SKILLS.map(s => `<button class="skill ${s.live ? '' : 'soon'}" data-skill="${s.name}">
          ${s.live ? '' : '<span class="tag">Sắp có</span>'}
          <span class="ic" style="background:${s.bg}">${s.svg}</span>${s.name}</button>`).join('')}
      </div>

      <div class="section-head"><h2>Lộ trình của bạn</h2><span class="label">Trạm ${Math.min(S.stopDone + 1, STOPS.length)}/${STOPS.length}</span></div>
      <div class="path" id="path">
        ${STOPS.map((st, i) => {
          const state = i < S.stopDone ? 'done' : i === S.stopDone ? 'current' : 'locked';
          const ic = state === 'done' ? ICON.check : state === 'current' ? (i === STOPS.length - 1 ? ICON.trophy : ICON.play) : (i === STOPS.length - 1 ? ICON.trophy : ICON.lock);
          return `<div class="stop ${state}">
            ${state === 'current' ? '<span class="start-flag">Bắt đầu</span>' : ''}
            <button class="node" data-stop="${i}" aria-label="${esc(st.title)}">${ic}</button>
            <div class="stop-text"><b>${esc(st.title)}</b><span>${esc(st.sub)}</span></div>
          </div>`;
        }).join('')}
      </div>
      <p class="note">Câu hỏi do AI soạn theo format TOEFL ITP, đang chờ giáo viên duyệt. Đây không phải đề thi thật của ETS. Điểm dự đoán chỉ mang tính minh hoạ.</p>
    </div>`;

    // animate score count-up + bar
    requestAnimationFrame(() => {
      $('#scaleFill').style.width = pct(S.score) + '%';
      const el = $('#scoreNum'); const t0 = performance.now(); const from = 310, to = S.score;
      const step = t => { const k = Math.min(1, (t - t0) / 1100); const e = 1 - Math.pow(1 - k, 3); el.textContent = Math.round(from + (to - from) * e); if (k < 1) requestAnimationFrame(step); };
      requestAnimationFrame(step);
    });
    setTimeout(() => { const b = $('#bigBear'); if (b) b.setAttribute('data-mood', 'idle'); }, 1500);

    let ci = 0;
    $('#heroBear').onclick = () => {
      ci = (ci + 1) % CHEERS_IDLE.length;
      const bub = $('#bubble'); bub.textContent = CHEERS_IDLE[ci];
      bub.classList.remove('pop'); void bub.offsetWidth; bub.classList.add('pop');
      setMood($('#bigBear'), 'happy', 'idle', 750);
    };
    $('#go').onclick = () => S.stopDone >= STOPS.length ? toast('Bạn đã đi hết lộ trình demo!') : openStop(S.stopDone);
    app.querySelectorAll('.skill').forEach(b => b.onclick = () => {
      if (b.dataset.skill === 'Listening') location.href = 'listening.html';
      else if (b.dataset.skill === 'Structure') startPractice(shuffle(QUESTIONS).slice(0, 10).map(q => q.id), 'Luyện Structure tự do');
      else toast(`${b.dataset.skill} sẽ có trong bản tiếp theo`);
    });
    app.querySelectorAll('.node').forEach(b => b.onclick = () => {
      const i = +b.dataset.stop;
      if (i > S.stopDone) { b.animate([{ transform: 'translateX(0)' }, { transform: 'translateX(-6px)' }, { transform: 'translateX(6px)' }, { transform: 'translateX(0)' }], { duration: 300 }); toast('Hoàn thành trạm trước để mở khoá'); }
      else openStop(i);
    });
  }

  function openStop(i) {
    const st = STOPS[i];
    if (!st) return;
    if (st.type === 'info') renderInfo(i);
    else if (st.type === 'lesson') renderIntro(i);
    else if (st.type === 'test') {
      // Same order as the real test: Structure items first, then Written Expression.
      const take = (kind, n) => shuffle(QUESTIONS.filter(q => q.kind === kind)).slice(0, n).map(q => q.id);
      const ids = [...take('Structure', st.structure), ...take('Written Expression', st.written)];
      startPractice(ids, st.title, { stopIndex: i, minutes: st.minutes, test: true });
    }
  }

  function backBar(title) {
    return `<div class="q-top"><button class="icon-btn" id="back" aria-label="Quay lại">${ICON.close}</button><h2 style="font-size:20px">${esc(title)}</h2></div>`;
  }

  function renderInfo(i) {
    tab = 'info'; showNav(false);
    app.innerHTML = `<div class="screen">
      ${backBar('Làm quen đề TOEFL ITP')}
      <div class="intro-hero">${bear('wave', 'iBear')}<div class="bubble">Đề Level 1 có 3 phần, làm trong 115 phút. Mình xem nhanh nhé!</div></div>
      <div class="table-wrap"><table class="fmt">
        <thead><tr><th>Phần thi</th><th>Số câu</th><th>Thời gian</th><th>Thang điểm</th></tr></thead>
        <tbody>
          <tr><td>Listening Comprehension</td><td>50</td><td>35 phút</td><td>31–68</td></tr>
          <tr><td>Structure &amp; Written Expression</td><td>40</td><td>25 phút</td><td>31–68</td></tr>
          <tr><td>Reading Comprehension</td><td>50</td><td>55 phút</td><td>31–67</td></tr>
          <tr class="total"><td>Tổng</td><td>140</td><td>115 phút</td><td>310–677</td></tr>
        </tbody>
      </table></div>
      <div class="tips">
        <h3>Section 2 gồm 2 dạng câu</h3>
        <div class="tip"><b>Structure (15 câu):</b> câu còn một chỗ trống, chọn 1 trong 4 đáp án để hoàn thành câu.</div>
        <div class="tip"><b>Written Expression (25 câu):</b> câu có 4 phần gạch chân A–D, tìm phần phải sửa thì câu mới đúng.</div>
        <div class="tip"><b>Nhịp độ:</b> trung bình khoảng 37 giây mỗi câu. Câu nào phân vân quá lâu thì loại trừ đáp án sai rồi chọn và đi tiếp.</div>
      </div>
      <p class="note">Thông tin theo TOEFL ITP Test Taker Handbook của ETS.</p>
      <button class="btn" id="ok">${S.stopDone > i ? 'Đã hiểu' : 'Đã hiểu, sang trạm tiếp'}</button>
    </div>`;
    $('#back').onclick = renderHome;
    $('#ok').onclick = () => { if (S.stopDone === i) { S.stopDone++; save(); } renderHome(); };
  }

  function renderIntro(i) {
    tab = 'intro'; showNav(false);
    const st = STOPS[i];
    const ids = QUESTIONS.filter(q => q.station === i).map(q => q.id);
    app.innerHTML = `<div class="screen">
      ${backBar(`Trạm ${i}: ${st.title}`)}
      <div class="intro-hero">${bear('idle', 'iBear')}<div class="bubble">Đọc 3 mẹo này trước, rồi mình luyện ${ids.length} câu nhé!</div></div>
      <div class="tips">
        <h3>Mẹo cần nhớ</h3>
        ${st.tips.map((t, k) => `<div class="tip" style="animation-delay:${.08 * k}s"><span class="tip-n">${k + 1}</span><span>${esc(t)}</span></div>`).join('')}
      </div>
      <button class="btn" id="start">${ICON.play.replace('<svg', '<svg width="20" height="20"')}Bắt đầu ${ids.length} câu</button>
    </div>`;
    $('#back').onclick = renderHome;
    $('#start').onclick = () => startPractice(shuffle(ids), `Trạm ${i}: ${st.title}`, { stopIndex: i });
  }

  function renderMistakes() {
    tab = 'mistakes'; showNav(true);
    const list = S.mistakes.map(id => byId[id]).filter(Boolean);
    app.innerHTML = `<div class="screen">
      <header class="topbar"><h1>Sổ lỗi sai</h1></header>
      ${list.length ? `
        <p class="lead">Câu bạn làm sai được tự động lưu ở đây. Làm đúng khi ôn lại thì câu đó sẽ được gạch khỏi sổ.</p>
        <button class="btn coral" id="redo">Ôn lại ${list.length} câu sai</button>
        ${list.map(q => `<article class="mist">
          <div class="meta"><span class="pill kind">${q.kind}</span><span class="pill no">${esc(q.topic)}</span></div>
          <div class="q">${q.text ? esc(q.text) : renderSegs(q, false)}</div>
          <div class="meta"><span class="pill ok">Đáp án: ${String.fromCharCode(65 + q.answer)}${q.text ? ' · ' + esc(q.options[q.answer]) : ''}</span></div>
          <p>${esc(q.explain)}</p>
        </article>`).join('')}`
      : `<div class="empty">${bear('sleep')}<h2>Sổ đang trống</h2><div>Chưa có lỗi sai nào. Browny ngủ một chút đây.</div></div>
         <button class="btn" id="toHome">Đi luyện tập</button>`}
    </div>`;
    const r = $('#redo'); if (r) r.onclick = () => startPractice(S.mistakes.slice(), 'Ôn lỗi sai');
    const h = $('#toHome'); if (h) h.onclick = renderHome;
  }

  function renderSegs(q, labels = true, bad = -1) {
    return q.segs.map(s => Array.isArray(s)
      ? `<span class="seg ${bad === s[1].charCodeAt(0) - 65 ? 'bad' : ''}">${esc(s[0])}${labels ? `<sub>${s[1]}</sub>` : ''}</span>`
      : esc(s)).join('');
  }

  /* ---------------- Practice ---------------- */
  function startPractice(ids, title, opts = {}) {
    stopTimer();
    run = { ids, title, stopIndex: opts.stopIndex ?? -1, test: !!opts.test, i: 0, correct: 0, xp: 0, t0: Date.now(), picked: null, locked: false, wrong: [], answered: 0 };
    if (opts.minutes) {
      run.deadline = Date.now() + opts.minutes * 60000;
      timer = setInterval(() => {
        const el = $('#clock'); const left = run.deadline - Date.now();
        if (left <= 0) { stopTimer(); hideSheet(); toast('Hết giờ!'); setTimeout(renderResult, 200); return; }
        if (el) { el.textContent = fmtClock(left); el.classList.toggle('low', left < 60000); }
      }, 500);
    }
    renderQuestion();
  }
  const fmtClock = ms => { const s = Math.ceil(ms / 1000); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };

  function renderQuestion() {
    tab = 'practice'; showNav(false);
    const q = byId[run.ids[run.i]];
    run.picked = null; run.locked = false;
    // Structure options are shuffled each time; Written Expression letters are tied to the sentence.
    run.order = q.kind === 'Structure' ? shuffle([0, 1, 2, 3]) : [0, 1, 2, 3];
    const pct = (run.i / run.ids.length) * 100;
    app.innerHTML = `<div class="screen" style="padding-bottom:180px">
      <div class="q-top">
        <button class="icon-btn" id="quit" aria-label="Thoát bài">${ICON.close}</button>
        <div class="progress" role="progressbar" aria-valuenow="${run.i}" aria-valuemax="${run.ids.length}"><i id="pbar" style="width:${pct}%"></i></div>
        <span class="q-count">${run.i + 1}/${run.ids.length}</span>
        ${run.deadline ? `<span class="clock" id="clock">${fmtClock(run.deadline - Date.now())}</span>` : ''}
      </div>
      <span class="q-kind">${q.kind} · ${esc(q.topic)}</span>
      <p class="q-ask">${q.kind === 'Structure' ? 'Chọn đáp án hoàn thành câu.' : 'Chọn phần gạch chân cần sửa.'}</p>
      <div class="q-row">
        <div class="q-text" id="qtext">${q.text ? esc(q.text).replace('_____', '<span class="blank"></span>') : renderSegs(q)}</div>
        ${bear('idle', 'qBear')}
      </div>
      <div class="options" id="opts">
        ${run.order.map((k, pos) => `<button class="opt" data-k="${k}"><span class="key">${String.fromCharCode(65 + pos)}</span><span>${esc(q.kind === 'Structure' ? q.options[k] : 'Phần ' + q.options[k])}</span></button>`).join('')}
      </div>
      <button class="btn" id="check" disabled>Kiểm tra</button>
    </div>`;

    $('#quit').onclick = () => { stopTimer(); hideSheet(); renderHome(); };
    app.querySelectorAll('.opt').forEach(b => b.onclick = () => choose(+b.dataset.k));
    $('#check').onclick = check;
  }

  function choose(k) {
    if (run.locked) return;
    run.picked = k;
    app.querySelectorAll('.opt').forEach(b => b.classList.toggle('sel', +b.dataset.k === k));
    $('#check').disabled = false;
  }

  function check() {
    if (run.picked === null || run.locked) return;
    run.locked = true; run.answered++;
    const q = byId[run.ids[run.i]];
    const ok = run.picked === q.answer;
    const opts = app.querySelectorAll('.opt');
    const optFor = k => app.querySelector(`.opt[data-k="${k}"]`);
    opts.forEach(b => b.disabled = true);
    optFor(q.answer).classList.add('right');
    if (!ok) optFor(run.picked).classList.add('wrong');
    if (q.segs) $('#qtext').innerHTML = renderSegs(q, true, q.answer);
    $('#check').hidden = true;
    $('#pbar').style.width = ((run.i + 1) / run.ids.length) * 100 + '%';

    const qb = $('#qBear');
    if (ok) {
      run.correct++; run.xp += 10;
      setMood(qb, 'happy', 'idle', 800);
      const r = optFor(q.answer).getBoundingClientRect();
      confetti(r.left + r.width / 2, r.top + r.height / 2);
      xpFloat(r.right - 60, r.top, 10);
      if (S.mistakes.includes(q.id)) S.mistakes = S.mistakes.filter(x => x !== q.id);
    } else {
      setMood(qb, 'sad');
      run.wrong.push(q.id);
      if (!S.mistakes.includes(q.id)) S.mistakes.push(q.id);
    }
    save();

    const last = run.i === run.ids.length - 1;
    const answerLabel = q.kind === 'Structure' ? `${String.fromCharCode(65 + run.order.indexOf(q.answer))}. ${q.options[q.answer]}` : `Phần ${q.options[q.answer]}`;
    showSheet(ok, `
      <h3>${ok ? ICON.check.replace('<svg', '<svg width="26" height="26"') : ''}${ok ? pick(CHEERS_OK) : pick(CHEERS_NO)}</h3>
      ${ok ? '' : `<p class="ans">Đáp án đúng: ${esc(answerLabel)}</p>`}
      <p>${esc(q.explain)}</p>
      <button class="btn ${ok ? 'mint' : 'coral'}" id="next">${last ? 'Xem kết quả' : 'Tiếp tục'}</button>`);
    $('#next').onclick = next;
    $('#next').focus({ preventScroll: true });
  }

  function next() {
    hideSheet();
    if (run.i < run.ids.length - 1) { run.i++; setTimeout(renderQuestion, 120); }
    else setTimeout(renderResult, 150);
  }

  function showSheet(ok, html) {
    const s = $('#sheet'); $('#sheetInner').innerHTML = html;
    s.className = 'sheet ' + (ok ? 'ok' : 'no');
    requestAnimationFrame(() => s.classList.add('show'));
  }
  function hideSheet() { $('#sheet').classList.remove('show'); }

  function renderResult() {
    if (tab === 'result') return;
    stopTimer();
    tab = 'result'; showNav(false);
    const n = run.ids.length, c = run.correct;
    const ratio = c / n;
    const stars = ratio >= .85 ? 3 : ratio >= .6 ? 2 : ratio > 0 ? 1 : 0;
    const secs = Math.round((Date.now() - run.t0) / 1000);
    const bonus = stars * 5;
    S.xp += run.xp + bonus;
    let unlocked = false;
    if (run.stopIndex >= 0 && run.stopIndex === S.stopDone && ratio >= .6) { S.stopDone++; unlocked = true; S.score = Math.min(677, S.score + 6); }
    save();
    // Rough linear mapping onto the Section 2 scale (31–68); a placeholder until real conversion data exists.
    const est = run.test ? Math.round(31 + 37 * ratio) : null;

    const titles = ['Cố lên nào!', 'Khá lắm!', 'Giỏi lắm!', 'Xuất sắc!'];
    app.innerHTML = `<div class="screen result">
      ${bear(stars >= 2 ? 'cheer' : 'idle', 'rBear')}
      <div class="stars">${[0, 1, 2].map(i => (i < stars ? bigStar : dimStar).replace('<svg', `<svg style="animation-delay:${.25 + i * .22}s"`)).join('')}</div>
      <h1>${titles[stars]}</h1>
      <div class="sub">${esc(run.title)}${unlocked ? ' · Đã mở khoá trạm mới' : ''}</div>
      <div class="stats">
        <div class="stat"><b>${c}/${n}</b><span>Câu đúng</span></div>
        <div class="stat"><b>+${run.xp + bonus}</b><span>XP</span></div>
        <div class="stat"><b>${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, '0')}</b><span>Thời gian</span></div>
      </div>
      ${est !== null ? `<div class="est"><span class="label">Điểm Section 2 ước tính</span><b>${est}</b><span>/ 68 · ước tính sơ bộ${run.answered < n ? ` · còn ${n - run.answered} câu chưa làm` : ''}</span></div>` : ''}
      <div class="actions">
        ${run.wrong.length ? `<button class="btn ghost" id="review">Ôn lại ${run.wrong.length} câu sai</button>` : ''}
        <button class="btn" id="home">Về trang chủ</button>
      </div>
    </div>`;
    if (stars >= 2) setTimeout(() => {
      const r = $('#rBear').getBoundingClientRect();
      confetti(r.left + r.width / 2, r.top + 30); setTimeout(() => confetti(r.left + r.width / 2, r.top + 30), 260);
    }, 400);
    const rv = $('#review'); if (rv) rv.onclick = () => startPractice(run.wrong.slice(), 'Ôn lỗi sai');
    $('#home').onclick = renderHome;
  }

  /* ---------------- Global events ---------------- */
  document.querySelectorAll('.nav button').forEach(b => b.onclick = () => {
    if (b.dataset.tab === 'home') renderHome();
    else if (b.dataset.tab === 'mistakes') renderMistakes();
    else toast('Thi thử full 115 phút sẽ có ở bản V2');
  });

  document.addEventListener('keydown', e => {
    if (tab !== 'practice' || !run) return;
    const k = e.key.toUpperCase();
    const idx = '1234'.indexOf(k) >= 0 ? '1234'.indexOf(k) : 'ABCD'.indexOf(k);
    if (idx >= 0 && !run.locked && k.length === 1) choose(run.order[idx]);
    else if (e.key === 'Enter') {
      if (run.locked && $('#next')) { e.preventDefault(); next(); }
      else if (run.picked !== null) { e.preventDefault(); check(); }
    }
  });

  renderHome();
})();
</script>
